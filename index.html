<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1d4ed8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>📦 My Inventory</h1>
    <div class="menu">
      <button class="btn" id="menuBtn">⋯</button>
      <div class="dropdown" id="dropdown">
        <button data-act="export">Download items (CSV)</button>
        <button data-act="exporth">Download buy/sell history (CSV)</button>
        <button data-act="backup">Save backup</button>
        <button data-act="restore">Restore backup</button>
        <button data-act="clear" class="red">Delete everything</button>
      </div>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="bar">
    <input id="search" type="search" placeholder="🔍 Search items…">
    <button class="btn primary" id="addBtn">＋ Add item</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="items">Items</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="list"></div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
